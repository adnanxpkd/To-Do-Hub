{% extends 'base.html' %}
{% block content %}
<h3>Add Note</h3>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Save</button>
  <a href="{% url 'notes_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
